# Gera os builds de Windows e Linux com a GameCI (https://game.ci).
#
# Antes de rodar, cadastre em Settings > Secrets and variables > Actions:
#   UNITY_EMAIL     e-mail da conta Unity
#   UNITY_PASSWORD  senha da conta Unity
#   UNITY_LICENSE   conteúdo do arquivo de licença .ulf (licença Personal)
# Com licença Pro, troque UNITY_LICENSE por UNITY_SERIAL.
#
# Quando roda:
#   - manualmente (aba Actions > Build > Run workflow);
#   - em push na main que mude o jogo (Assets, Packages ou ProjectSettings);
#   - em tags v* (ex.: v1.0.0), que também criam uma Release com os zips.
name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
    tags: ['v*']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneWindows64   # Mono; IL2CPP para Windows exigiria runner Windows
          - StandaloneLinux64
    steps:
      - name: Liberar espaço em disco (as imagens da Unity têm ~6 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache da pasta Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-

      - name: Build
        uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: ProjectRoll
          versioning: None   # usa a versão de Project Settings > Player

      - name: Publicar build
        uses: actions/upload-artifact@v4
        with:
          name: ProjectRoll-${{ matrix.targetPlatform }}
          path: |
            build/${{ matrix.targetPlatform }}
            !build/${{ matrix.targetPlatform }}/**/*_BackUpThisFolder_ButDontShipItWithYourGame
            !build/${{ matrix.targetPlatform }}/**/*_BurstDebugInformation_DoNotShip
          retention-days: 14

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar builds
        uses: actions/download-artifact@v4
        with:
          path: builds

      - name: Compactar
        run: |
          cd builds
          for d in */; do (cd "$d" && zip -qr "../${d%/}.zip" .); done
          ls -lh *.zip

      - name: Criar Release
        uses: softprops/action-gh-release@v2
        with:
          files: builds/*.zip
          generate_release_notes: true
